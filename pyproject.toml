[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoho-skills"
version = "0.2.5"
description = "Zoho Projects automation for AI agents: org rule packs + a gated MCP proxy, with a guided multi-harness installer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["mcp>=1.9,<2"]

[project.scripts]
zoho-skills = "zoho_skills.cli:main"

[project.urls]
Homepage = "https://github.com/cr-arunkumar/creole-zoho-skills"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "zoho_skills/_data/skills"
"packs" = "zoho_skills/_data/packs"
"templates" = "zoho_skills/_data/templates"
".claude-plugin/plugin.json" = "zoho_skills/_data/.claude-plugin/plugin.json"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "packs", "templates", ".claude-plugin/plugin.json", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
