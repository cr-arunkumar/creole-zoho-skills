# Publishes the `zoho-skills` npm package (the name comes from package.json).
#
# How to cut a release:
#   1. Bump "version" in package.json, pyproject.toml AND .claude-plugin/plugin.json
#      (tests and the tag guard below enforce that they match).
#   2. Commit the change.
#   3. git tag vX.Y.Z && git push --tags
#      (or publish a GitHub release for that tag).
#
# The tag (without the leading "v") must equal package.json and pyproject.toml "version".
# If that version is already on npm, the publish step is skipped, so reruns are safe.
# Requires the NPM_TOKEN repository secret, or npm trusted publishing + repo variable NPM_TRUSTED_PUBLISHING=true.
name: publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install package and test dependencies
        run: |
          uv pip install -e . pytest fastapi httpx
      - run: uv run --no-sync python scripts/build_adapters.py --check
      - run: sh -n install.sh
      - run: shellcheck install.sh
      - run: uv run --no-sync python -m pytest -q tests

      - name: Guard - tag must match package.json and pyproject.toml version
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          py_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          tag_version="${TAG#v}"
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$py_version" ]; then
            echo "::error::Tag '$TAG' ($tag_version) must match package.json ($pkg_version) and pyproject.toml ($py_version)"
            exit 1
          fi
          echo "Tag $TAG matches package.json and pyproject.toml version $pkg_version"

      # GitHub is the primary, fully automatic distribution: the wheel is attached to the release and installable
      # the moment this job gets here (install.sh, `uv tool install`, `zoho-skills update`). npm below is a mirror.
      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: GitHub release with the wheel
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Smoke-test the GitHub install path
        if: github.event_name == 'push'
        run: |
          v="${GITHUB_REF_NAME#v}"
          export UV_TOOL_DIR="$RUNNER_TEMP/zs-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/zs-bin"
          uv tool install --force "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/zoho_skills-${v}-py3-none-any.whl"
          out="$("$UV_TOOL_BIN_DIR/zoho-skills" --version)"
          echo "$out"
          [ "$out" = "zoho-skills ${v}" ]

      - name: Check whether this version is already on npm
        id: npm_check
        run: |
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${pkg_name}@${pkg_version} is already published on npm - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${pkg_name}@${pkg_version} not found on npm - will publish."
          fi

      # npm mirror. Token publish (default): npm may hold it for a maintainer's approval ("staged publishing");
      # that never blocks installs, which use the GitHub release above.
      - name: Publish to npm (token)
        if: steps.npm_check.outputs.exists != 'true' && vars.NPM_TRUSTED_PUBLISHING != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Trusted publishing (no token, no secret): enabled by `npm trust github ... --allow-publish` plus the repo
      # variable NPM_TRUSTED_PUBLISHING=true. Needs npm >= 11.5 for the OIDC exchange.
      - name: Publish to npm (trusted publishing)
        if: steps.npm_check.outputs.exists != 'true' && vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance

      # npm may hold the release for a maintainer's approval (staged publishing) and then needs a few minutes to
      # serve the tarball. Wait for it and smoke-test the real `npx` install so this run ends with "installable".
      - name: Wait until installable, then smoke-test npx
        timeout-minutes: 25
        continue-on-error: true
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          url="https://registry.npmjs.org/${name}/-/${name}-${version}.tgz"
          code=000
          for _ in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            [ "$code" = 200 ] && break
            echo "::notice::${name}@${version} not installable yet (HTTP ${code}) - waiting for npm approval/propagation"
            sleep 15
          done
          [ "$code" = 200 ] || { echo "::warning::${name}@${version} is still not installable; approve it on npmjs.com"; exit 1; }
          out="$(npx --yes --prefer-online "${name}@${version}" --version)"
          echo "$out"
          [ "$out" = "zoho-skills ${version}" ] || { echo "::error::unexpected version output: $out"; exit 1; }
