name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          uv pip install -e . pytest fastapi httpx
      - run: uv run --no-sync python scripts/build_adapters.py --check
      - run: sh -n install.sh
      - run: shellcheck install.sh
      - run: uv run --no-sync python -m pytest -q tests
